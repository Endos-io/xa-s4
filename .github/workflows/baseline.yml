name: baseline
on: [workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -U "pip>=25.1" setuptools wheel
      - run: pip install -e . --group pyproject.toml:dev
      - run: pip install tzdata
      - run: python -m pytest xarray/tests properties --junit-xml=junit.xml
             -p no:cacheprovider -p no:randomly -o addopts=
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with: { name: junit, path: junit.xml }
